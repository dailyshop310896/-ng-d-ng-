<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer metallic bevel ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#27272a" stroke-width="8"/>
  <circle cx="256" cy="256" r="170" fill="#121318" stroke="#3f3f46" stroke-width="4"/>
  
  <!-- Glow halo -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="140" filter="url(#glow)" opacity="0.3"/>
  
  <!-- Power Icon Ring Arc -->
  <path d="M 180 180 A 115 115 0 1 0 332 180" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Power Icon Vertical Stem -->
  <line x1="256" y1="120" x2="256" y2="240" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Center indicator dot -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.9"/>
</svg>
